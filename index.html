<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Grocery Store</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=1600') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        .cart-status {
            background: #e67e22;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Cart Badge Effect */
        .cart-status:hover { 
            background: #d35400; 
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
        }

        .role-switch select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            font-weight: bold;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
        }

        h1, h2 { text-align: center; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); }

        /* Admin Section */
        .admin-section {
            display: none; 
            background: rgba(255, 255, 255, 0.95);
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-section h2 { color: #2c3e50; margin-top: 0; text-shadow: none; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #27ae60; box-shadow: 0 0 5px rgba(39, 174, 96, 0.4); }
        
        .btn-add { 
            background: #27ae60; color: white; padding: 10px; border: none; 
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-add:hover { background: #219150; transform: translateY(-2px); }

        /* Category Filter Buttons */
        .category-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn-category {
            background: rgba(255, 255, 255, 0.85);
            color: #2c3e50;
            border: 2px solid #2980b9;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-category:hover, .btn-category.active {
            background: #2980b9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.4);
        }

        .controls { text-align: center; margin-bottom: 30px; }
        
        .btn-sort { 
            padding: 10px 20px; font-size: 15px; cursor: pointer; background: #8e44ad; 
            color: white; border: none; border-radius: 25px; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s ease;
        }
        .btn-sort:hover { 
            background: #732d91; transform: scale(1.05); 
            box-shadow: 0 6px 15px rgba(142, 68, 173, 0.4);
        }

        /* Product Cards Grid & Animation */
        .product-grid { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; }

        /* Product Card UI + Hover Effects */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            border-radius: 15px; 
            width: 220px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        /* Hover Effect */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            border-radius: 10px; 
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card h3 { font-size: 18px; margin: 12px 0 5px 0; color: #2c3e50; }
        .category { color: #7f8c8d; font-size: 13px; margin-bottom: 5px; }
        .price { font-weight: bold; color: #e74c3c; font-size: 18px; margin-bottom: 10px; }

        /* Buttons with Animation */
        .btn-cart {
            background: #27ae60; color: white; border: none; padding: 10px 12px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;
            transition: all 0.2s ease;
        }
        .btn-cart:hover { 
            background: #219150; 
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
        }
        .btn-cart:active { transform: scale(0.96); }

        .btn-delete {
            background: #e74c3c; color: white; border: none; padding: 10px 12px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;
            transition: all 0.2s ease;
        }
        .btn-delete:hover { 
            background: #c0392b; 
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }

        /* Cart Modal Styling */
        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: #fff; margin: 8% auto; padding: 25px; border-radius: 15px; 
            width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn { position: absolute; right: 18px; top: 12px; font-size: 26px; cursor: pointer; color: #888; transition: 0.2s; }
        .close-btn:hover { color: #e74c3c; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #eee; padding: 10px 0;
        }

        .btn-remove-item { 
            background: #e74c3c; color: white; border: none; padding: 6px 12px; 
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s;
        }
        .btn-remove-item:hover { background: #c0392b; }
        .cart-total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 15px; color: #2c3e50; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <h3>Online Grocery Store</h3>
        
        <!-- Cart Status Button -->
        <div class="cart-status" onclick="openCartModal()">
            🛒 Cart: <span id="cartCount">0</span> items
        </div>

        <!-- Role Selector -->
        <div class="role-switch">
            <label for="userRole"><b>Role: </b></label>
            <select id="userRole" onchange="switchRole()">
                <option value="user">Customer / User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
    </div>

    <h1>Product Catalog</h1>

    <!-- Categories Filter Bar -->
    <div class="category-container" id="categoryButtons">
        <button class="btn-category active" onclick="filterCategory('All', this)">All Products</button>
    </div>

    <!-- Admin Form -->
    <div id="adminPanel" class="admin-section">
        <h2>Admin Panel - Add Product</h2>
        <div class="form-group">
            <input type="text" id="prodName" placeholder="Product Name">
            <input type="text" id="prodCategory" placeholder="Category (e.g., Fruits, Dairy, Bakery)">
            <input type="number" id="prodPrice" placeholder="Price (Rs.)">
            <input type="text" id="prodImage" placeholder="Image Name / Path (e.g., apple.jpg)">
            <button class="btn-add" onclick="addProduct()">Add Product</button>
        </div>
    </div>

    <!-- Merge Sort Button -->
    <div class="controls">
        <button class="btn-sort" onclick="sortProductsByPrice()">Sort Displayed Items by Price</button>
    </div>

    <!-- Product List Grid -->
    <div id="product-container" class="product-grid"></div>

    <!-- Cart Modal Popup -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2 style="color: #2c3e50; text-align: left;">Your Cart</h2>
            <div id="cartItemsContainer">
                <p>Your cart is empty.</p>
            </div>
            <div class="cart-total">
                Total: Rs. <span id="cartTotal">0.00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
